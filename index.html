<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inkbow: The Last Guardian</title>
<meta name="description" content="Inkbow: a watercolor archer defense game. Hold the platform, shoot arrows out of the air, and awaken your bow.">
<meta name="theme-color" content="#1b1626">
<meta property="og:title" content="Inkbow: The Last Guardian">
<meta property="og:description" content="A watercolor archer defense game for phone and PC.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232e2a5c'/%3E%3Cpath d='M22 10q26 22 0 44' fill='none' stroke='%23f2c24c' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M22 10v44M12 32h40M52 32l-8-5M52 32l-8 5' stroke='%23fff3cf' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1626;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Cormorant Garamond",Georgia,serif;color:#fff}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.k{font-family:"Kaushan Script","Brush Script MT",cursive}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#top{position:absolute;left:12px;right:12px;top:10px}
#row{display:flex;align-items:center;justify-content:space-between;height:36px}
#wave{font-size:19px;text-shadow:0 1px 6px rgba(20,10,40,.7);min-width:84px}
#score{font-size:28px;text-shadow:0 2px 8px rgba(20,10,40,.75);text-align:center;flex:1}
#bPause{pointer-events:auto;width:36px;height:36px;border-radius:50% 46% 52% 48%;border:0;background:rgba(250,240,220,.85);color:#2a2244;font-size:15px;font-weight:700;box-shadow:0 2px 8px rgba(20,10,40,.35)}
.bar{height:11px;width:min(58vw,260px);border-radius:7px 9px 6px 10px;background:rgba(24,16,44,.5);overflow:hidden;margin-top:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:100%;border-radius:inherit;transition:width .18s}
#hp i{background:linear-gradient(90deg,#e0463e,#ff8a5c)}
#xp{height:6px}#xp i{background:linear-gradient(90deg,#7fd8ff,#d9f4ff);width:0}
#boss{display:none;margin:8px auto 0;width:min(86vw,420px)}
#boss .bar{width:100%;height:9px}#boss i{background:linear-gradient(90deg,#8d2bd6,#ff4d6d)}
#boss span{display:block;text-align:center;font-size:15px;text-shadow:0 1px 6px rgba(20,10,40,.8)}
#combo{position:absolute;left:0;right:0;top:152px;text-align:center;font-size:22px;opacity:0;transition:opacity .25s;text-shadow:0 2px 8px rgba(20,10,40,.75);color:#ffe9a8}
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;opacity:0;transition:opacity .5s;text-shadow:0 3px 14px rgba(20,10,40,.8)}
#banner b{display:block;font-size:44px;font-weight:400}
#banner span{font-size:19px;font-style:italic;letter-spacing:.04em}
#hint{position:absolute;left:8%;right:8%;top:42%;text-align:center;font-size:18px;font-style:italic;opacity:0;transition:opacity .5s;text-shadow:0 2px 8px rgba(20,10,40,.9)}
.rb{pointer-events:auto;position:absolute;border:0;border-radius:50%;padding:0;background:none}
.rb .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(24,16,44,.55) 0);box-shadow:0 3px 12px rgba(20,10,40,.45)}
.rb .in{position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbf3e0,#e6d5b8);display:flex;align-items:center;justify-content:center}
.rb svg{width:56%;height:56%}
.rb.off .in{filter:grayscale(.8) brightness(.72)}
.rb.ready .ring{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px 6px var(--c)}}
#bSpirit{right:14px;bottom:20px;width:78px;height:78px;--c:#ffcf5a;--p:0}
#bShield{right:104px;bottom:24px;width:60px;height:60px;--c:#8fd8ff;--p:100}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center;background:rgba(22,14,40,.42)}
.card{background:linear-gradient(160deg,#fbf4e3,#eddcbf);color:#2a2244;border-radius:18px 24px 16px 26px/24px 16px 26px 18px;box-shadow:0 10px 40px rgba(15,8,30,.5);padding:22px 22px 20px;max-width:380px;width:100%}
.card h1{font-size:54px;margin:0;font-weight:400;line-height:1;color:#b8322c}
.card h2{font-size:34px;margin:0 0 6px;font-weight:400;color:#b8322c}
.card p{margin:8px 0;font-size:18px;line-height:1.3}
.card small{font-size:15px;opacity:.75;font-style:italic}
.btn{pointer-events:auto;margin-top:12px;border:0;font-size:26px;padding:9px 34px 11px;color:#fff8e8;background:linear-gradient(160deg,#d4443a,#9c2740);border-radius:16px 22px 14px 24px/22px 14px 24px 16px;box-shadow:0 4px 14px rgba(120,20,30,.45)}
.btn.alt{background:none;color:#2a2244;box-shadow:inset 0 0 0 1.5px rgba(42,34,68,.5);font-size:19px;padding:6px 20px 8px}
#perks{background:rgba(22,14,40,.6)}
#perks h2{font-size:36px;margin:0 0 12px;font-weight:400;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#pc{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:720px}
.pk{pointer-events:auto;flex:1 1 200px;max-width:340px;border:0;text-align:left;padding:13px 16px;font-family:inherit;color:#2a2244;background:linear-gradient(160deg,#fbf4e3,#ecd9b8);border-radius:14px 20px 12px 22px/20px 12px 22px 14px;box-shadow:0 6px 22px rgba(15,8,30,.45);border-left:7px solid var(--c)}
.pk b{display:block;font-size:25px;font-weight:400}
.pk span{font-size:17px}
#fade{position:absolute;inset:0;background:#f6ecd8;opacity:0;pointer-events:none;transition:opacity .6s}
#tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .12s}
@media (orientation:landscape) and (max-height:500px){#combo{top:104px}.card h1{font-size:40px}.card p{font-size:16px;margin:4px 0}}
canvas{cursor:crosshair}
#ink{font-size:15px;margin-top:4px;text-shadow:0 1px 5px rgba(20,10,40,.8);color:#ffe9a8}
#arrows{position:absolute;left:12px;bottom:22px;display:flex;gap:9px}
.ab{pointer-events:auto;position:relative;width:50px;height:50px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#fbf3e0,#e6d5b8);box-shadow:0 3px 10px rgba(20,10,40,.45);transition:transform .1s}
.ab svg{width:58%;height:58%;margin-top:4px}
.ab.off{filter:grayscale(.85) brightness(.7)}
.ab.sel{box-shadow:0 0 0 3px var(--c),0 0 18px 4px var(--c);transform:translateY(-5px)}
.kh{display:none;position:absolute;right:-3px;top:-5px;min-width:18px;height:18px;border-radius:9px;background:#2a2244;color:#fff;font:700 11px/18px sans-serif;text-align:center;padding:0 5px;z-index:2}
body.pc .kh{display:block}
.scroll{max-height:calc(100vh - 30px);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.realms{display:flex;gap:7px;justify-content:center;margin:10px 0 4px}
.rl{pointer-events:auto;width:54px;border:0;border-radius:12px 15px 11px 16px;padding:6px 0 5px;font-family:inherit;color:#2a2244;background:#fff8ea;box-shadow:inset 0 0 0 1.5px rgba(42,34,68,.35)}
.rl b{display:block;font-size:20px;font-weight:400}.rl i{font-size:11px;font-style:normal;color:#c8862a;letter-spacing:1px}
.rl.sel{background:linear-gradient(160deg,#d4443a,#9c2740);color:#fff8e8}.rl.sel i{color:#ffe08a}
.rl:disabled{opacity:.4}.btn:disabled{opacity:.45}
.br{font-size:22px;margin:12px 0 6px;text-align:left;color:#b8322c}
.nodes{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.nd{pointer-events:auto;text-align:left;border:0;border-radius:11px 14px 10px 15px;padding:7px 9px;font-family:inherit;color:#2a2244;background:#fff8ea;box-shadow:inset 0 0 0 1.5px rgba(42,34,68,.3)}
.nd b{display:block;font-size:17px;font-weight:400}.nd span{display:block;font-size:13.5px;line-height:1.15}.nd em{display:block;font-size:13px;font-style:normal;color:#9c2740;margin-top:2px}
.nd.max{background:#f3e2b5}.nd:disabled{opacity:.45}
button{cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tint"></div>
<div id="hud">
  <div id="top">
    <div id="row"><div id="wave" class="k">Wave 1</div><div id="score" class="k">0</div><button id="bPause" aria-label="Pause">II</button></div>
    <div class="bar" id="hp"><i></i></div>
    <div class="bar" id="xp"><i></i></div>
    <div id="ink" class="k"></div>
    <div id="boss"><span class="k">The Hollow King</span><div class="bar"><i></i></div></div>
  </div>
  <div id="combo" class="k"></div>
  <div id="banner" class="k"><b></b><span></span></div>
  <div id="hint"></div>
  <div id="arrows">
    <button class="ab off" data-a="ember" style="--c:#ff8a3c" aria-label="Ember arrow"><span class="kh">1</span><svg viewBox="0 0 24 24" fill="#e2543a"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 1-3-1-6 1-10z"/></svg></button>
    <button class="ab off" data-a="storm" style="--c:#8fc0ff" aria-label="Storm arrow"><span class="kh">2</span><svg viewBox="0 0 24 24" fill="#4f7fd9"><path d="M13 2L5 14h5l-1 8 8-12h-5z"/></svg></button>
    <button class="ab off" data-a="gale" style="--c:#8fe0c0" aria-label="Gale volley"><span class="kh">3</span><svg viewBox="0 0 24 24" fill="none" stroke="#2f9a80" stroke-width="2.2" stroke-linecap="round"><path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/></svg></button>
  </div>
  <button id="bShield" class="rb" aria-label="Shield"><span class="kh">Space</span><div class="ring"></div><div class="in"><svg viewBox="0 0 24 24" fill="none" stroke="#2a4a7a" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l8 3v6.2c0 4.8-3.3 8.3-8 9.8-4.7-1.5-8-5-8-9.8V5.5z"/></svg></div></button>
  <button id="bSpirit" class="rb off" aria-label="Starfall"><span class="kh">E</span><div class="ring"></div><div class="in"><svg viewBox="0 0 24 24" fill="#c8862a"><path d="M12 1l2.3 7.2L21.5 6l-4.7 5.9 5.7 4.3-7.3.2L12 23l-3.2-6.6-7.3-.2 5.7-4.3L2.5 6l7.2 2.2z"/></svg></div></button>
</div>
<div id="menu" class="ov" style="display:flex"><div class="card scroll">
  <h1 class="k">Inkbow</h1><p><i>The Last Guardian</i></p>
  <p id="mHelp"></p>
  <div class="realms" id="mRealms"></div>
  <p><small id="mBow"></small></p>
  <button class="btn k" id="bPlay">Begin</button><br>
  <button class="btn alt" id="bEndless">Endless</button> <button class="btn alt" id="bTree">Skill Tree</button>
</div></div>
<div id="tree" class="ov"><div class="card scroll"><h2 class="k">Skill Tree</h2><p id="tInk"></p><div id="tBody"></div>
  <button class="btn alt" id="bRespec">Respec</button> <button class="btn alt" id="bBack">Back</button></div></div>
<div id="perks" class="ov"><h2 class="k">Choose a blessing</h2><div id="pc"></div></div>
<div id="pause" class="ov"><div class="card"><h2 class="k">Paused</h2>
  <button class="btn k" id="bResume">Resume</button><br>
  <button class="btn alt" id="bMute">Sound: on</button> <button class="btn alt" id="bQuit">Menu</button></div></div>
<div id="over" class="ov"><div class="card"><h2 class="k" id="oTitle">The light fades</h2><p id="oStats"></p><p><small id="oBow"></small></p>
  <button class="btn k" id="bRetry">Try again</button><br><button class="btn alt" id="bMenu">Menu</button></div></div>
<div id="fade"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,OV=26,PC=matchMedia('(hover:hover) and (pointer:fine)').matches;if(PC)document.body.classList.add('pc');
let W=0,H=0,DPR=1,S=1,GY=0,PH=0,AX=0,AY=0,perches=[];
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const gauss=()=>(Math.random()+Math.random()+Math.random()+Math.random()-2)/2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.random()*a.length|0];
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]};
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const shade=(c,f)=>f<0?mix(c,[0,0,0],-f):mix(c,[255,255,255],f);

/* ---------- watercolour primitives ---------- */
function deform(p,rounds,v){for(let r=0;r<rounds;r++){const q=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];q.push(a);const L=Math.min(Math.hypot(b[0]-a[0],b[1]-a[1]),60),m=L*v*gauss(),an=Math.random()*TAU;q.push([(a[0]+b[0])/2+Math.cos(an)*m,(a[1]+b[1])/2+Math.sin(an)*m]);}p=q;}return p;}
function poly(c,p){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();}
function wash(c,pts,col,o={}){const n=o.layers||7,a=o.alpha||.14,v=o.vari===undefined?.3:o.vari;const base=deform(pts,o.br===undefined?1:o.br,v*.6);
  for(let i=0;i<n;i++){c.fillStyle=rgba(o.vary?shade(col,gauss()*o.vary):col,a);poly(c,deform(base,2,v));c.fill();}
  if(o.edge!==0){c.strokeStyle=rgba(shade(col,-.4),o.edge||.2);c.lineWidth=o.ew||1;c.lineJoin='round';poly(c,deform(base,2,v*.3));c.stroke();}}
function stroke(c,x1,y1,x2,y2,w,col,a=.5,n){n=n||Math.max(3,w*.9|0);const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,bend=gauss()*len*.07;c.lineCap='round';
  for(let i=0;i<n;i++){const t=(i/(n-1||1)-.5)*w+gauss()*w*.07,s=rnd(0,.14),e=1-rnd(0,.14);const ax=x1+dx*s+nx*t,ay=y1+dy*s+ny*t,bx=x1+dx*e+nx*t,by=y1+dy*e+ny*t;
    c.strokeStyle=rgba(col,a*rnd(.3,1));c.lineWidth=rnd(.5,1.7)*(w/n)*1.25;c.beginPath();c.moveTo(ax,ay);c.quadraticCurveTo((ax+bx)/2+nx*bend,(ay+by)/2+ny*bend,bx,by);c.stroke();}}
function bloom(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function splat(c,x,y,r,col,n,a=.4,sz=1.8){for(let i=0;i<n;i++){const an=rnd(TAU),d=Math.pow(Math.random(),.6)*r;c.fillStyle=rgba(col,a*rnd(.3,1));c.beginPath();c.arc(x+Math.cos(an)*d,y+Math.sin(an)*d,rnd(.3,sz),0,TAU);c.fill();}}
function circ(cx,cy,rx,ry,n=14){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return p;}
function dens(pts,step){const o=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],n=Math.max(1,Math.hypot(b[0]-a[0],b[1]-a[1])/step|0);for(let j=0;j<n;j++)o.push([lerp(a[0],b[0],j/n),lerp(a[1],b[1],j/n)]);}return o;}
function inkLine(c,p,col,a=.5,w=1){c.lineCap='round';for(let i=0;i<p.length;i++){if(Math.random()<.3)continue;const A=p[i],B=p[(i+1)%p.length];c.strokeStyle=rgba(col,a*rnd(.4,1));c.lineWidth=rnd(.4,1.3)*w;c.beginPath();c.moveTo(A[0]+gauss()*.4,A[1]+gauss()*.4);c.lineTo(B[0]+gauss()*.4,B[1]+gauss()*.4);c.stroke();}}

/* ---------- palettes ---------- */
const pal=o=>{for(const k in o){const v=o[k];if(typeof v==='string'&&v[0]==='#')o[k]=hex(v);else if(Array.isArray(v))o[k]=v.map(hex);}return o;};
const PALS=[
pal({name:'Golden Dusk',sky:['#2e2a5c','#8d4f86','#e9837a','#fbd18f'],orb:'#fff3cf',glow:'#ffc77a',ox:.64,oy:.47,or:.14,cloud:'#ffd9c2',far:'#b58fb0',near:'#5a3a66',mist:'#f8cfa6',rock:'#4b3355',lit:'#d98a6f',stone:'#9a7f98',ground:'#5b3d5b',gd:'#241a33',grass:'#e29a54',tree:'#d8674f',flower:'#ffe08a',wx:'ember'}),
pal({name:'Moonlit Pass',sky:['#0b1433','#1f3f72','#5f8fb8','#cfe3ee'],orb:'#f6fbff',glow:'#a9d4ff',ox:.58,oy:.3,or:.18,moon:1,stars:1,cloud:'#c9dcf0',far:'#9db6d2',near:'#3d5a82',mist:'#dcebf5',rock:'#2e4468',lit:'#dfeefa',stone:'#8ea6c2',ground:'#b9d0e2',gd:'#4e6f95',grass:'#f4fbff',tree:'#6f8fb0',flower:'#ffffff',wx:'snow'}),
pal({name:'Autumn Vale',sky:['#4f8f9c','#a9cfc0','#f6dfae','#f3a56b'],orb:'#fffbe6',glow:'#ffe2a0',ox:.7,oy:.36,or:.1,cloud:'#fff4e0',far:'#d9a17a',near:'#8f4a36',mist:'#fbe6c4',rock:'#6b3a2e',lit:'#f0a865',stone:'#b08f74',ground:'#7a4630',gd:'#3a1f1c',grass:'#e8892f',tree:'#d9482b',flower:'#ffd34d',wx:'leaf'}),
pal({name:'Storm Cliffs',sky:['#161c2a','#36465c','#6f8496','#b7c2c4'],orb:'#e9f1f5',glow:'#b9cbd6',ox:.38,oy:.27,or:.08,moon:1,cloud:'#55647a',far:'#7d8fa0',near:'#2f3b4b',mist:'#aebcc4',rock:'#252e3c',lit:'#8fa3b3',stone:'#6a798b',ground:'#34404e',gd:'#141a24',grass:'#7fa08f',tree:'#3f5a58',flower:'#d7e6ea',wx:'rain'}),
pal({name:'Spirit Realm',sky:['#0e0728','#3a1670','#9a3f9e','#f58fb3'],orb:'#ffe3f4',glow:'#ff9fe0',ox:.6,oy:.34,or:.2,moon:1,ring:1,stars:1,cloud:'#b98ae8',far:'#8f6fe0',near:'#3a1f7a',mist:'#f0a8d8',rock:'#2a1560',lit:'#c79bff',stone:'#8a6fd0',ground:'#2c1a5e',gd:'#120a30',grass:'#7ff0e0',tree:'#ff8fd0',flower:'#fff3a8',wx:'wisp'})];
const INK=[26,20,46];

/* ---------- scene painting ---------- */
let L=[],clouds=[],mistSpr,paperPat,vig,sprCache={},heroSpr,splatCache={};
function skyAt(p,t){const s=p.sky,f=clamp(t,0,.999)*(s.length-1),i=f|0;return mix(s[i],s[i+1],f-i);}
function ridgePts(y0,amp,step){const p=[],k1=TAU/(W*rnd(.5,.9)),k2=TAU/(W*rnd(.2,.35)),k3=TAU/(W*rnd(.07,.12)),a=rnd(TAU),b=rnd(TAU),c=rnd(TAU);
  for(let x=-OV-10;x<=W+OV+10;x+=step)p.push([x,y0-amp*(.55*(1-Math.abs(Math.sin(x*k1+a)))+.3*(1-Math.abs(Math.sin(x*k2+b)))+.15*Math.sin(x*k3+c))+gauss()*amp*.02]);return p;}
function island(x,cx,y,w,p,far){const rock=far?mix(p.far,p.mist,.25):p.rock,a=far?.1:.2;
  const pts=dens([[cx-w/2,y],[cx+w/2,y],[cx+w*.4,y+w*.2],[cx+w*.16,y+w*.5],[cx-w*.02,y+w*.82],[cx-w*.17,y+w*.44],[cx-w*.4,y+w*.2]],w/9);

  sprCache={};paintHero();makePaper();buildScene();enemies.forEach(e=>{e.spr=enemySpr(e.kind==='walker'?e.type:e.kind,e.acc);if(e.perch===null&&e.kind!=='rider')e.y=GY;});}

cv.addEventListener('pointerdown',e=>{if(e.button===2){shield();return;}if(G.state!=='play'||G.paused||aim)return;aim={id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,pull:0};try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(aim&&e.pointerId===aim.id){aim.x=e.clientX;aim.y=e.clientY;}});
const rel=e=>{if(!aim||e.pointerId!==aim.id)return;const v=aimVec();if(v)v.ch=G.charge>=.55;aim=null;if(v&&e.type==='pointerup'){if(G.reload<=0)shootArrow(v.a,v.p,v.ch);else queued=v;}};
cv.addEventListener('pointerup',rel);cv.addEventListener('pointercancel',rel);
document.addEventListener('contextmenu',e=>e.preventDefault());
const tap=(id,f)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();f();});
tap('bShield',shield);tap('bSpirit',starfall);
const ABS=[...document.querySelectorAll('.ab')];ABS.forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();selArrow(b.dataset.a);}));
let selRealm=1,lastMode='camp',lastRealm=1;
function begin(mode,realm){initAudio();if(AC&&AC.state==='suspended')AC.resume();mode=mode||lastMode;realm=realm||lastRealm;lastMode=mode;lastRealm=realm;PERKS.forEach(p=>p.cnt=0);const had=G.pal;reset();G.mode=mode;G.pal=mode==='camp'?realm-1:Math.random()*5|0;if(G.pal!==had)buildScene();
  ['menu','over','pause','tree','perks'].forEach(i=>$(i).style.display='none');$('boss').style.display='none';$('hud').style.display='block';$('combo').style.opacity=0;G.state='play';G.paused=false;last=performance.now();
  startWave(mode==='camp'?(realm-1)*5+1:1);if(mode==='camp'&&realm===1)hint(PC?'Click and drag anywhere, pull back and release to shoot':'Drag anywhere, pull back and release to shoot',5000);
  if(mode==='camp'&&realm>1){G.pending=(realm-1)*3;G.lvl+=G.pending;openPerks();}}
function goMenu(){G.state='menu';G.paused=false;enemies=[];earrows=[];arrows=[];bonus=null;aim=null;perches.forEach(p=>p.occ=null);['over','pause','tree','perks'].forEach(i=>$(i).style.display='none');$('hud').style.display='none';$('tint').style.opacity=0;renderMenu();$('menu').style.display='flex';}
function renderMenu(){const t=tier(),nx=TIERS[t+1];selRealm=Math.min(selRealm,save.unlock);
  $('mHelp').innerHTML=PC?'Click and drag to aim, release to shoot.<br><b>Space</b> or right-click: shield · <b>1 2 3</b>: spirit arrows · <b>E</b>: Starfall · <b>Esc</b>: pause':'Drag anywhere, pull back, release to shoot.<br>Shoot arrows out of the air. Tap the shield at the last moment to deflect.';
  const r=$('mRealms');r.innerHTML='';PALS.forEach((p,i)=>{const b=document.createElement('button');b.className='rl'+(selRealm===i+1?' sel':'');b.disabled=i+1>save.unlock;const st=save.stars[i]||0;b.innerHTML=`<b class="k">${i+1}</b><i>${'★'.repeat(st)+'☆'.repeat(3-st)}</i>`;b.title=p.name;b.onclick=()=>{selRealm=i+1;renderMenu();};r.appendChild(b);});
  $('mBow').textContent=`${PALS[selRealm-1].name} · ${TIERS[t].n}${nx?` (${Math.max(0,nx.k-save.kills)} kills to ${nx.n})`:''}`;
  $('bPlay').textContent=selRealm>1?'Begin realm '+selRealm:'Begin';$('bEndless').disabled=!save.endless;$('bEndless').textContent=save.endless?`Endless${save.bestE?' · best '+save.bestE:''}`:'Endless (beat realm 1)';$('bTree').textContent=`Skill Tree · ✦ ${save.ink}`;}
function renderTree(){$('tInk').innerHTML=`<b>✦ ${save.ink} ink</b> · earned from kills, waves and lantern spirits`;const body=$('tBody');body.innerHTML='';
  [['Offense',0],['Defense',4],['Spirit',8]].forEach(([nm,o])=>{const h=document.createElement('div');h.className='br k';h.textContent=nm;body.appendChild(h);const g=document.createElement('div');g.className='nodes';
    for(let i=o;i<o+4;i++){const[id,n,d,mx,cs]=SK[i],lv=sk(id),lock=i>o&&!sk(SK[i-1][0]),b=document.createElement('button');b.className='nd'+(lv>=mx?' max':'');b.disabled=lock||(lv<mx&&save.ink<cs[lv]);
      b.innerHTML=`<b class="k">${n}</b><span>${d}</span><em>${lv>=mx?'Mastered':lock?'Locked':`Lv ${lv}/${mx} · ${cs[lv]} ink`}</em>`;b.onclick=()=>{if(lv>=mx||save.ink<cs[lv])return;save.ink-=cs[lv];save.sk[id]=lv+1;persist();initAudio();sfx.perk();renderTree();};g.appendChild(b);}
    body.appendChild(g);});}
$('bPlay').onclick=()=>begin('camp',selRealm);$('bEndless').onclick=()=>begin('endless',1);$('bRetry').onclick=()=>begin();$('bMenu').onclick=goMenu;$('bQuit').onclick=goMenu;
$('bTree').onclick=()=>{$('menu').style.display='none';renderTree();$('tree').style.display='flex';};$('bBack').onclick=()=>{$('tree').style.display='none';renderMenu();$('menu').style.display='flex';};
$('bRespec').onclick=()=>{SK.forEach(([id,,,,cs])=>{for(let i=0;i<sk(id);i++)save.ink+=cs[i];});save.sk={};persist();renderTree();};
$('bPause').onclick=()=>{if(G.state!=='play'||$('perks').style.display==='flex')return;G.paused=true;aim=null;$('pause').style.display='flex';};
$('bResume').onclick=()=>{G.paused=false;last=performance.now();$('pause').style.display='none';};
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent='Sound: '+(muted?'off':'on');};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!G.paused&&$('perks').style.display!=='flex')$('bPause').onclick();});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),on=i=>$(i).style.display==='flex';
  if(e.code==='Space'){e.preventDefault();if(on('menu'))begin('camp',selRealm);else shield();}
  else if(k==='q')shield();else if(k==='e'||k==='f')starfall();
  else if(k==='1'||k==='2'||k==='3'){if(on('perks')){const b=$('pc').children[k-1];if(b)b.click();}else selArrow(['ember','storm','gale'][k-1]);}
  else if(k==='escape'||k==='p'){if(on('pause'))$('bResume').onclick();else $('bPause').onclick();}
  else if(k==='enter'){if(on('menu'))begin('camp',selRealm);else if(on('over'))begin();}});
reset();layout();
renderMenu();
window.__dbg={G,save,begin,spawn,startWave,setPal:i=>{G.pal=i;buildScene();},get enemies(){return enemies;},perches:()=>perches,pos:()=>({AX,AY,GY,W,H,S})};
requestAnimationFrame(frame);
})();
